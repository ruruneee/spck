<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Sign in · GDTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand brand--auth" href="index.html" aria-label="GDTrack home">
        <span class="brand-mark" aria-hidden="true">GD</span>
        <span>GDTrack</span>
      </a>
      <p class="eyebrow">YOUR PROGRESS, IN ONE PLACE</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to pick up where you left off.</p>

      <form class="form-stack" data-login-form>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <p class="message" data-auth-message role="status" hidden></p>
        <button class="button button--primary button--full" type="submit">Sign in</button>
      </form>

      <p class="auth-switch">New to GDTrack? <a href="signup.html">Create an account</a></p>
      <p class="local-note">A simple school-project app. Your account is saved only in this browser.</p>
    </main>
  </body>
</html>
