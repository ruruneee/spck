<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Top 150 · GDTrack</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/list.js"></script>
  </head>
  <body data-page="list">
    <header class="topbar">
      <a class="brand" href="tracker.html">
        <span class="brand-mark" aria-hidden="true">GD</span>
        <span>GDTrack</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a data-nav-page="tracker" href="tracker.html">Tracker</a>
        <a data-nav-page="list" href="list.html">List</a>
        <a data-nav-page="account" href="account.html">Account</a>
      </nav>
      <div class="user-menu">
        <span class="user-greeting">Hi, <strong data-current-username></strong></span>
        <button class="button button--quiet button--small" type="button" data-signout>Sign out</button>
      </div>
    </header>

    <main class="page-shell list-shell">
      <section class="page-heading">
        <div>
          <h1>Main List</h1>
        </div>
      </section>

      <section class="panel list-panel" aria-labelledby="top-list-title">
        <div class="section-heading">
          <div>
            <h2 id="top-list-title">Current rankings</h2>
            <p class="muted" data-list-status aria-live="polite">Loading</p>
          </div>
        </div>
        <label class="search-box list-search" for="top-list-search">
          <input id="top-list-search" type="search" autocomplete="off" placeholder="Filter by level name or in-game ID">
        </label>
        <div class="empty-state" data-list-error hidden>
          <span class="empty-icon" aria-hidden="true">!</span>
          <h3>Loading failed</h3>
          <p data-list-error-message></p>
        </div>
        <div class="top-level-list" data-top-level-list aria-live="polite"></div>
      </section>
    </main>

  </body>
</html>
