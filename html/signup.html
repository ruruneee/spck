<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Create account · GDTrack</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand brand--auth" href="index.html" aria-label="GDTrack home">
        <span class="brand-mark" aria-hidden="true">GD</span>
        <span>GDTrack</span>
      </a>
      <h1>Create your account</h1>

      <form class="form-stack" data-signup-form>
        <label for="signup-username">Username</label>
        <input id="signup-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="24" placeholder="Your name" required>
        <label for="signup-email">Email</label>
        <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="signup-password">Password</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="4" placeholder="At least 4 characters" required>
        <p class="message" data-auth-message role="status" hidden></p>
        <button class="button button--primary button--full" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>
    </main>
  </body>
</html>
